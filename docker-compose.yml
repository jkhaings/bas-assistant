# Local stack: app, Postgres (pgvector), Redis, LiteLLM proxy.
# Sessions D and E add Langfuse, Prometheus and Grafana.
# Local development only. Ports bind to 127.0.0.1, and Postgres uses trust auth, so no
# password is written anywhere (one committed to a public repo would protect nothing).
# Never run this file on the droplet: session E's production compose sets POSTGRES_PASSWORD
# and DATABASE_URL from /etc/bas-assistant.env.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bas
      POSTGRES_DB: bas
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bas -d bas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    # main-stable, pinned by digest (LiteLLM 1.102.1).
    image: ghcr.io/berriai/litellm-database:main-stable@sha256:c38fe5eff11874941a21f5630ceb842f640dee7d5d5cde440b60ed0a71798f33
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: ${HOME}/.bas-assistant.env
    environment:
      DATABASE_URL: postgresql://bas@postgres:5432/litellm
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    command: ["sh", "-c", "alembic upgrade head && exec python -m bas_assistant"]
    env_file: ${HOME}/.bas-assistant.env
    environment:
      DATABASE_URL: postgresql://bas@postgres:5432/bas
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
