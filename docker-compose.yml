# Session 0: app placeholder only.
# Sessions A-E add postgres, redis, litellm, langfuse, prometheus, grafana.

services:
  app:
    build: .
    env_file: ${HOME}/.bas-assistant.env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
