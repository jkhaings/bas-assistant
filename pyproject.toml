[project]
name = "bas-assistant"
version = "0.1.0"
description = "Internal support assistant for building-automation documentation"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "selectolax>=0.3.21",
    "docling>=2.15",
    "llama-index-core>=0.12",
    "sentence-transformers>=3.3",
    "pypdfium2>=4.30",
    "torch>=2.0",
    "torchvision>=0.20",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langchain-core>=1.6",
    "psycopg-pool>=3.3.3",
    "redis>=8.1.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bas_assistant"]

# ---------------------------------------------------------------------------
# uv — CPU-only torch wheels on Linux (Docker/CI); default index elsewhere
# (macOS has no CUDA wheels anyway, so dev machines are unaffected).
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
# torchvision must come from the same index as torch (a transitive need of
# transformers' vision utilities, unused by our code) — a version built
# against a different torch build fails at import with a native-op mismatch.
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests", ".claude/hooks"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "UP",             # pyupgrade
    "B",              # flake8-bugbear
    "C4",             # flake8-comprehensions
    "SIM",            # flake8-simplify
    "C90",            # mccabe
    "RUF",            # ruff-specific
    "ARG",            # flake8-unused-arguments
    "PL",             # pylint
    "PIE",            # flake8-pie
    "PERF",           # perflint
    "T20",            # flake8-print (bans print)
]
ignore = [
    "E501",           # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]   # magic numbers fine in test assertions

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(fn)`; Depends()
# (and the other parameter markers) are meant to be constructed fresh in each
# default position, not a mutable-default bug. Ruff's own docs name this as
# the standard allowlist entry for FastAPI projects.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 8
max-statements = 30
max-returns = 4

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", ".claude/hooks"]
plugins = ["pydantic.mypy"]

# Untyped or partially-typed third-party packages (no py.typed / no stubs on PyPI).
[[tool.mypy.overrides]]
module = [
    "docling.*",
    "selectolax.*",
    "sentence_transformers.*",
    "llama_index.*",
    "pypdfium2.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "--strict-markers -q"
markers = [
    "unit: no network, no docker, deterministic",
    "integration: requires docker compose up",
    "eval: requires live LLM and corpus",
    "redteam: requires live system, local only",
]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
