[project]
name = "bas-assistant"
version = "0.1.0"
description = "Internal support assistant for building-automation documentation"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bas_assistant"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests", ".claude/hooks"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "UP",             # pyupgrade
    "B",              # flake8-bugbear
    "C4",             # flake8-comprehensions
    "SIM",            # flake8-simplify
    "C90",            # mccabe
    "RUF",            # ruff-specific
    "ARG",            # flake8-unused-arguments
    "PL",             # pylint
    "PIE",            # flake8-pie
    "PERF",           # perflint
    "T20",            # flake8-print (bans print)
]
ignore = [
    "E501",           # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]   # magic numbers fine in test assertions

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 8
max-statements = 30
max-returns = 4

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", ".claude/hooks"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "--strict-markers -q"
markers = [
    "unit: no network, no docker, deterministic",
    "integration: requires docker compose up",
    "eval: requires live LLM and corpus",
    "redteam: requires live system, local only",
]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
