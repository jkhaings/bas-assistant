# Self-hosted Langfuse v4 for traces, included from docker-compose.yml. Trimmed from the
# compose file Langfuse publishes (github.com/langfuse/langfuse, docker-compose.yml): only
# the web UI is published, on 127.0.0.1:3001 (Grafana has 3000). Its own Postgres, Redis,
# ClickHouse and MinIO keep it apart from the app's data.
#
# TODO(session E): pin the image versions (4.46.0 ran here), and decide whether Langfuse goes on
# the droplet at all: ClickHouse alone used about one core while idle here, which the CPU
# reranker competes with (HANDOFF_D.md, drop order #2).
#
# Secrets come from ~/.bas-assistant-langfuse.env (`make observability-secrets`); the
# project keys in it are the app's LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY.

# Every container's log is capped: Docker's default json-file log grows without limit, and on
# Sep 27 one container's log filled the 58 GB Docker disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "2"

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:3001
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"

x-langfuse-depends: &langfuse-depends
  langfuse-postgres:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy

services:
  langfuse-web:
    logging: *logging
    image: docker.langfuse.com/langfuse/langfuse:4
    env_file: ${HOME}/.bas-assistant-langfuse.env
    environment:
      <<: *langfuse-env
      # First start only: the org, the project with the app's keys, and one login.
      LANGFUSE_INIT_ORG_ID: bas-assistant
      LANGFUSE_INIT_ORG_NAME: bas-assistant
      LANGFUSE_INIT_PROJECT_ID: bas-assistant
      LANGFUSE_INIT_PROJECT_NAME: bas-assistant
      LANGFUSE_INIT_USER_EMAIL: admin@bas.local
      LANGFUSE_INIT_USER_NAME: admin
    depends_on: *langfuse-depends
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$$(hostname):3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    restart: unless-stopped

  langfuse-worker:
    logging: *logging
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    env_file: ${HOME}/.bas-assistant-langfuse.env
    environment: *langfuse-env
    depends_on: *langfuse-depends
    restart: unless-stopped

  langfuse-postgres:
    logging: *logging
    image: postgres:17
    env_file: ${HOME}/.bas-assistant-langfuse.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  langfuse-clickhouse:
    logging: *logging
    image: clickhouse/clickhouse-server:25.12
    user: "101:101"
    env_file: ${HOME}/.bas-assistant-langfuse.env
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
    volumes:
      - langfuse_clickhouse:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse.xml:/etc/clickhouse-server/config.d/zz-bas-assistant.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  langfuse-minio:
    logging: *logging
    image: cgr.dev/chainguard/minio
    env_file: ${HOME}/.bas-assistant-langfuse.env
    environment:
      MINIO_ROOT_USER: minio
    entrypoint: sh
    # The bucket is a directory; creating it first saves a separate init container.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    volumes:
      - langfuse_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  langfuse-redis:
    logging: *logging
    image: redis:7-alpine
    env_file: ${HOME}/.bas-assistant-langfuse.env
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_AUTH\" --maxmemory-policy noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  langfuse_pgdata:
  langfuse_clickhouse:
  langfuse_clickhouse_logs:
  langfuse_minio:
