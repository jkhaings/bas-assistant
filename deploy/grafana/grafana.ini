; Grafana for the two dashboards, embedded same-origin under /grafana in the web app.
; Session E sets GF_SERVER_ROOT_URL for the public domain.

[server]
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/grafana/
serve_from_sub_path = true

[security]
admin_user = admin
admin_password = $__env{GRAFANA_ADMIN_PASSWORD}
; The app embeds the dashboards in an iframe.
allow_embedding = true
disable_gravatar = true

; No login in the demo: anonymous visitors see the dashboards read-only.
[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
hide_version = true

[users]
allow_sign_up = false
viewers_can_edit = false

; Viewers never get a free-form query editor.
[explore]
enabled = false

[unified_alerting]
enabled = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false
