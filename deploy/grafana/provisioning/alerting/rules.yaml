# Grafana-managed alert rules. No contact point is provisioned yet: firing alerts show in
# Grafana's alerting page only (docs/ARCHITECTURE.md §8, deferred).
# TODO(post-weekend): an email or webhook contact point for the droplet (HANDOFF_E.md).
apiVersion: 1

groups:
  - orgId: 1
    name: bas-assistant
    folder: bas-assistant
    interval: 1m
    rules:
      - uid: bas-error-rate
        title: API error rate above 5%
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: page}
        annotations:
          summary: More than 5% of API responses in the last 5 minutes were 5xx.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum(rate(bas_http_requests_total{status=~"5.."}[5m]))
                / sum(rate(bas_http_requests_total[5m]))
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.05]}

      - uid: bas-p95-latency
        title: p95 answer latency above 8 s
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: page}
        annotations:
          summary: The 95th percentile of question-to-answer time over 5 minutes is above 8 s.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                histogram_quantile(0.95,
                sum by (le) (rate(bas_request_latency_seconds_bucket[5m])))
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [8]}

      - uid: bas-spend-50
        title: Daily spend at 50% of the cap
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: info}
        annotations:
          summary: Today's model spend has reached half of DAILY_USD_CAP.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: postgres
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: SELECT pct_of_cap FROM dash_spend_today
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gte, params: [50]}

      - uid: bas-spend-80
        title: Daily spend at 80% of the cap
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: Today's model spend has reached 80% of DAILY_USD_CAP.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: postgres
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: SELECT pct_of_cap FROM dash_spend_today
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gte, params: [80]}

      - uid: bas-spend-100
        title: Daily spend at 100% of the cap
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: page}
        annotations:
          summary: Today's model spend has reached DAILY_USD_CAP; /ask now returns 503 until midnight UTC.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: postgres
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: SELECT pct_of_cap FROM dash_spend_today
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gte, params: [100]}
