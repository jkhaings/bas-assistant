<!doctype html>
<!-- Checks that both dashboards load inside a plain iframe (allow_embedding, anonymous
     Viewer, served under /grafana). Open with Grafana running on localhost:3000. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grafana embed test</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; color: #eee; }
    h2 { margin: 8px 12px; font-size: 14px; }
    iframe { width: 100%; height: 640px; border: 0; }
  </style>
</head>
<body>
  <h2>Budget</h2>
  <iframe src="http://localhost:3000/grafana/d/bas-budget/budget?orgId=1&kiosk"></iframe>
  <h2>Quality &amp; adoption</h2>
  <iframe src="http://localhost:3000/grafana/d/bas-quality/quality-and-adoption?orgId=1&kiosk"></iframe>
</body>
</html>
