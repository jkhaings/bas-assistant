name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: git --redact

      - name: ruff check
        run: uv run ruff check src/ tests/ eval/ .claude/hooks/

      - name: ruff format
        run: uv run ruff format --check src/ tests/ eval/ .claude/hooks/

      - name: mypy
        run: uv run mypy src/ tests/ eval/ .claude/hooks/

      - name: pytest unit
        run: uv run pytest -m unit
